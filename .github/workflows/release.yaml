name: Release Binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: target/release/rustyman.exe
            assets_name: rustyman-windows-x86_64.exe

          - os: ubuntu-latest
            binary: target/release/rustyman
            assets_name: rustyman-linux-x86_64

          - os: macos-latest
            binary: target/release/rustyman
            assets_name: rustyman-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin rustyman

      - name: Prepare release assets 
        shell: bash
        run: cp ${{ matrix.binary }} ${{ matrix.assets_name }}

      - name: upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.assets_name }}
          path: ${{ matrix.assets_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create github release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true