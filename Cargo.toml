[package]
name = "RustyMan-game"
version = "0.1.0"
edition = "2024"
description = "A horor-twist terminal pacman-like game, with limitid view. be carefull of ghost, boo!"
license = "MIT"
repository = "https://github.com/whyfren/RustyMan"
homepage = "https://whyfren.github.io/RustyMan"
readme = "README.md"
keywords = ["game", "pacman", "terminal", "tui", "horror"]
categories = ["games", "command-line-utilities"]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29.0"
rand = "0.10.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false